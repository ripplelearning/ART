name: Deploy ART to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_result.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # GitHub Pages deployment can occasionally fail on transient OIDC key propagation.
      # Retry once so a brief key-sync issue does not require a manual rerun.
      - name: Deploy to GitHub Pages
        id: deployment_primary
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment_primary.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Select deployment URL
        id: deployment_result
        if: ${{ always() }}
        run: |
          if [[ "${{ steps.deployment_primary.outcome }}" == "success" ]]; then
            echo "page_url=${{ steps.deployment_primary.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.deployment_retry.outcome }}" == "success" ]]; then
            echo "page_url=${{ steps.deployment_retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if deployment did not succeed
        if: ${{ always() && steps.deployment_primary.outcome == 'failure' && steps.deployment_retry.outcome != 'success' }}
        run: |
          echo "Both GitHub Pages deployment attempts failed."
          exit 1
