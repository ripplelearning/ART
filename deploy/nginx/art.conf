# nginx site configuration for the ART web application.
# Install to /etc/nginx/sites-available/art and symlink into sites-enabled.
# Serves the atomically-swapped release symlink at /srv/art/current.

server {
    listen 80;
    listen [::]:80;
    server_name art.example.com;

    # Certbot writes ACME challenges here; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name art.example.com;

    # Populated by certbot; comment this block out until certificates exist.
    ssl_certificate     /etc/letsencrypt/live/art.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/art.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /srv/art/current;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ART loads ES modules, JSON catalogs and packages relative to the document
    # root, and pulls the dictionary used by the editor's spell check from
    # jsDelivr. Tighten this list further if those features are disabled.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net https://www.googleapis.com https://graph.microsoft.com https://content.dropboxapi.com https://api.dropboxapi.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/markdown;

    # Releases are not content-hashed, so always revalidate rather than serving
    # stale application code after a deployment.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Block access to repository metadata that may travel with the payload.
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/art.access.log;
    error_log  /var/log/nginx/art.error.log;
}
